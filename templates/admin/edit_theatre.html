{% extends "admin/layout.html" %}
{% block title %}Edit Theatre | Admin CineSeat{% endblock %}

{% block content %}
<style>
    :root {
        --red: #E8272A;
        --red-dark: #B81D1F;
        --bg: #0A0A0B;
        --bg2: #111114;
        --surface: #1E1E24;
        --surface2: #26262E;
        --text: #F2F0EB;
        --text2: #9A9898;
        --text3: #5C5C60;
        --border: rgba(255, 255, 255, 0.07);
    }

    .custom-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .section-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text3);
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
    }

    .custom-admin-input {
        background: var(--surface) !important;
        border: 1px solid var(--border) !important;
        color: var(--text) !important;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        transition: 0.2s;
    }

    .custom-admin-input:focus {
        border-color: var(--red) !important;
        background: var(--surface2) !important;
        box-shadow: 0 0 0 3px rgba(232, 39, 42, 0.15) !important;
    }

    .custom-admin-input::placeholder {
        color: var(--text3);
    }

    .input-group-text.custom-admin-text {
        background: var(--surface) !important;
        border: 1px solid var(--border) !important;
        color: var(--text3) !important;
        border-radius: 8px 0 0 8px;
    }

    .feature-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: 0.2s;
    }

    .feature-card:hover {
        border-color: var(--border2);
    }

    .form-check-input {
        cursor: pointer;
        background-color: var(--bg);
        border-color: var(--border);
    }

    .form-check-input:checked {
        background-color: var(--red);
        border-color: var(--red);
    }

    .form-check-label {
        cursor: pointer;
    }

    .btn-red {
        background: var(--red);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 500;
        transition: 0.2s;
    }

    .btn-red:hover {
        background: var(--red-dark);
        color: #fff;
    }

    .btn-outline-custom {
        border: 1px solid var(--border2);
        color: var(--text2);
        background: transparent;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 500;
        transition: 0.2s;
    }

    .btn-outline-custom:hover {
        background: var(--surface);
        color: var(--text);
        border-color: var(--text3);
    }

    .form-label {
        font-size: 13px;
        color: var(--text2);
        font-weight: 500;
        margin-bottom: 6px;
    }
</style>

<div class="row mb-4 align-items-center">
    <div class="col-12">
        <a href="{{ url_for('admin_theatres') }}"
            class="text-decoration-none text-white-50 small mb-2 d-inline-block hover-white">
            <i class="bi bi-arrow-left me-1"></i> Back to Theatres
        </a>
        <h3 class="fw-medium mb-1 text-white"><i class="bi bi-building text-red me-2"></i> Edit Theatre</h3>
        <p class="text-white-50 small mb-0">Update location details and screen features for <strong
                class="text-white">{{ theatre.name }}</strong>.</p>
    </div>
</div>

<div class="row">
    <div class="col-12 col-xl-10 col-xxl-8">
        <div class="custom-card p-4 p-md-5">

            <form method="POST">

                <div class="section-title mt-2"><i class="bi bi-info-circle me-2"></i>Location Details</div>
                <div class="row g-4 mb-5">

                    <div class="col-md-12">
                        <label class="form-label">Theatre Name <span class="text-red">*</span></label>
                        <input type="text" name="name" class="form-control custom-admin-input"
                            value="{{ theatre.name }}" placeholder="e.g., CineSeat Grand" required>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">City / Location <span class="text-red">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text custom-admin-text border-end-0"><i
                                    class="bi bi-geo-alt"></i></span>
                            <input type="text" name="location"
                                class="form-control custom-admin-input border-start-0 ps-0"
                                value="{{ theatre.location }}" placeholder="e.g., Mumbai, Delhi" required>
                        </div>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-display me-2"></i> Supported Formats</div>
                <div class="row g-3 mb-5">

                    <div class="col-6 col-md-3">
                        <div class="feature-card p-3">
                            <div
                                class="form-check form-switch d-flex flex-column align-items-center justify-content-center gap-2 m-0 p-0">
                                <input type="checkbox" name="is_imax" class="form-check-input m-0 ms-auto me-auto"
                                    id="editImax" style="width: 40px; height: 20px;" {% if theatre.is_imax %}checked{%
                                    endif %}>
                                <label class="form-check-label text-white small mt-1 fw-medium"
                                    for="editImax">IMAX</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="feature-card p-3">
                            <div
                                class="form-check form-switch d-flex flex-column align-items-center justify-content-center gap-2 m-0 p-0">
                                <input type="checkbox" name="is_3d" class="form-check-input m-0 ms-auto me-auto"
                                    id="edit3d" style="width: 40px; height: 20px;" {% if theatre.is_3d %}checked{% endif
                                    %}>
                                <label class="form-check-label text-white small mt-1 fw-medium" for="edit3d">3D
                                    Ready</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="feature-card p-3">
                            <div
                                class="form-check form-switch d-flex flex-column align-items-center justify-content-center gap-2 m-0 p-0">
                                <input type="checkbox" name="is_4dx" class="form-check-input m-0 ms-auto me-auto"
                                    id="edit4dx" style="width: 40px; height: 20px;" {% if theatre.is_4dx %}checked{%
                                    endif %}>
                                <label class="form-check-label text-white small mt-1 fw-medium" for="edit4dx">4DX
                                    Motion</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="feature-card p-3">
                            <div
                                class="form-check form-switch d-flex flex-column align-items-center justify-content-center gap-2 m-0 p-0">
                                <input type="checkbox" name="is_dolby" class="form-check-input m-0 ms-auto me-auto"
                                    id="editDolby" style="width: 40px; height: 20px;" {% if theatre.is_dolby %}checked{%
                                    endif %}>
                                <label class="form-check-label text-white small mt-1 fw-medium" for="editDolby">Dolby
                                    Atmos</label>
                            </div>
                        </div>
                    </div>

                </div>

                <hr style="border-color: var(--border); margin: 32px 0;">
                <div class="d-flex gap-3 justify-content-end">
                    <a href="{{ url_for('admin_theatres') }}"
                        class="btn btn-outline-custom text-decoration-none">Cancel</a>
                    <button type="submit" class="btn btn-red px-5">
                        <i class="bi bi-check-lg me-1"></i> Update Theatre
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
