{% extends "admin/layout.html" %}
{% block title %}Edit Showtime | Admin CineSeat{% endblock %}

{% block content %}
<style>
    :root {
        --red: #E8272A;
        --red-dark: #B81D1F;
        --bg: #0A0A0B;
        --bg2: #111114;
        --surface: #1E1E24;
        --surface2: #26262E;
        --text: #F2F0EB;
        --text2: #9A9898;
        --text3: #5C5C60;
        --border: rgba(255, 255, 255, 0.07);
    }

    .custom-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .section-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text3);
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
    }

    .custom-admin-input {
        background: var(--surface) !important;
        border: 1px solid var(--border) !important;
        color: var(--text) !important;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        transition: 0.2s;
    }

    .custom-admin-input:focus {
        border-color: var(--red) !important;
        background: var(--surface2) !important;
        box-shadow: 0 0 0 3px rgba(232, 39, 42, 0.15) !important;
    }

    select.custom-admin-input option {
        background: var(--surface2);
        color: var(--text);
    }

    .btn-red {
        background: var(--red);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 500;
        transition: 0.2s;
    }

    .btn-red:hover {
        background: var(--red-dark);
        color: #fff;
    }

    .btn-outline-custom {
        border: 1px solid var(--border2);
        color: var(--text2);
        background: transparent;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 500;
        transition: 0.2s;
    }

    .btn-outline-custom:hover {
        background: var(--surface);
        color: var(--text);
        border-color: var(--text3);
    }

    .form-label {
        font-size: 13px;
        color: var(--text2);
        font-weight: 500;
        margin-bottom: 6px;
    }
</style>

<div class="row mb-4 align-items-center">
    <div class="col-12">
        <a href="{{ url_for('admin_showtimes') }}"
            class="text-decoration-none text-white-50 small mb-2 d-inline-block hover-white">
            <i class="bi bi-arrow-left me-1"></i> Back to Showtimes
        </a>
        <h3 class="fw-medium mb-1 text-white"><i class="bi bi-clock-history text-red me-2"></i> Edit Showtime</h3>
        <p class="text-white-50 small mb-0">Update the movie, theatre, and timing details for this specific screening.
        </p>
    </div>
</div>

<div class="row">
    <div class="col-12 col-xl-10 col-xxl-8">
        <div class="custom-card p-4 p-md-5">

            <form method="POST">

                <div class="section-title mt-2"><i class="bi bi-film me-2"></i> Screening Details</div>
                <div class="row g-4 mb-5">

                    <div class="col-md-6">
                        <label class="form-label">Select Movie <span class="text-red">*</span></label>
                        <select name="movie_id" class="form-select custom-admin-input" required>
                            <option value="" disabled>Choose a movie...</option>
                            {% for movie in movies %}
                            <option value="{{ movie.id }}" {% if movie.id==showtime.movie_id %}selected{% endif %}>
                                {{ movie.title }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Select Theatre <span class="text-red">*</span></label>
                        <select name="theatre_id" class="form-select custom-admin-input" required>
                            <option value="" disabled>Choose a theatre...</option>
                            {% for theatre in theatres %}
                            <option value="{{ theatre.id }}" {% if theatre.id==showtime.theatre_id %}selected{% endif
                                %}>
                                {{ theatre.name }} ({{ theatre.location }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-calendar3 me-2"></i> Date &amp; Time</div>
                <div class="row g-4 mb-4">

                    <div class="col-md-6">
                        <label class="form-label">Show Date <span class="text-red">*</span></label>
                        <input type="date" name="show_date" class="form-control custom-admin-input"
                            style="color-scheme: dark;" value="{{ showtime.show_date }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Show Time <span class="text-red">*</span></label>
                        <input type="time" name="show_time" class="form-control custom-admin-input"
                            style="color-scheme: dark;" value="{{ showtime.show_time }}" required>
                    </div>

                </div>

                <hr style="border-color: var(--border); margin: 32px 0;">
                <div class="d-flex gap-3 justify-content-end">
                    <a href="{{ url_for('admin_showtimes') }}"
                        class="btn btn-outline-custom text-decoration-none">Cancel</a>
                    <button type="submit" class="btn btn-red px-5">
                        <i class="bi bi-check-lg me-1"></i> Update Showtime
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
